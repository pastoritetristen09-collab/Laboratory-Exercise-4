{% extends "base.html" %}
{% block title %}Math Calculator - Autumn Portfolio{% endblock %}
{% block content %}
<h1>Math Calculators</h1>
<div style="margin-bottom: 25px;">
    <h3>Area of a Circle</h3>
    <form method="POST">
        <input type="hidden" name="shape" value="circle">
        <label>Radius:</label>
        <input type="number" step="any" name="radius" required>
        <button type="submit">Calculate Circle</button>
    </form>
</div>

<div>
    <h3>Area of a Triangle</h3>
    <form method="POST">
        <input type="hidden" name="shape" value="triangle">
        <label>Base:</label>
        <input type="number" step="any" name="base" required>
        <label>Height:</label>
        <input type="number" step="any" name="height" required>
        <button type="submit">Calculate Triangle</button>
    </form>
</div>

{% if result is not none %}
<div style="margin-top: 25px; padding: 15px; background: #ffccbc; border-radius: 6px; color: #3e2723;">
    <h3>Result for {{ shape|capitalize }}:</h3>
    <p style="font-size: 1.2rem; font-weight: bold;">{{ result }}</p>
</div>
{% endif %}
{% endblock %}
